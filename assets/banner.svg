<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Raghuram: Software Developer, AI/ML Engineer, Full-Stack and Mobile">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#203A64"/>
      <stop offset="0.55" stop-color="#111F36"/>
      <stop offset="1" stop-color="#0B1424"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#365783" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#365783" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gold" cx="0.08" cy="1" r="0.5">
      <stop offset="0" stop-color="#C7A261" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#C7A261" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gilt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E6C990"/>
      <stop offset="0.5" stop-color="#C7A261"/>
      <stop offset="1" stop-color="#E6C990"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FAF5EC" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#glow)"/>
  <rect width="1200" height="320" rx="18" fill="url(#gold)"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)"/>

  <!-- gold stars, echoing the portfolio's Nebula hero -->
  <g fill="#E6C990">
    <circle cx="930" cy="60" r="1.8" opacity=".9"/><circle cx="1010" cy="110" r="1.2" opacity=".7"/>
    <circle cx="1090" cy="70" r="2" opacity=".8"/><circle cx="1140" cy="160" r="1.3" opacity=".6"/>
    <circle cx="860" cy="140" r="1.1" opacity=".6"/><circle cx="980" cy="220" r="1.6" opacity=".7"/>
    <circle cx="1060" cy="250" r="1.2" opacity=".5"/><circle cx="790" cy="70" r="1.3" opacity=".5"/>
    <circle cx="700" cy="40" r="1" opacity=".5"/><circle cx="1160" cy="40" r="1.1" opacity=".6"/>
  </g>

  <!-- monogram -->
  <g transform="translate(980 96)">
    <rect width="128" height="128" rx="30" fill="#111F36" stroke="#C7A261" stroke-opacity=".6" stroke-width="2"/>
    <text x="58" y="88" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="76" fill="#FAF5EC">R</text>
    <circle cx="94" cy="86" r="7" fill="#C7A261"/>
  </g>

  <text x="64" y="96" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" letter-spacing="4" fill="#E6C990">HYDERABAD, INDIA · PORTFOLIO 2026</text>
  <text x="60" y="178" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-weight="700" font-size="78" letter-spacing="-2" fill="#FAF5EC">Raghuram</text>
  <rect x="64" y="208" width="92" height="3" rx="1.5" fill="url(#gilt)"/>
  <text x="64" y="248" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="28" fill="#E6C990">builds intelligent products</text>
  <text x="64" y="284" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" letter-spacing="1" fill="#FAF5EC" fill-opacity=".7">Software Developer · AI/ML Engineer · Full-Stack &amp; Mobile</text>
</svg>
